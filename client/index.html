<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Black GPT</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljs-theme">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="logo-mark">BG</div>
        <div>
          black-gpt-local
          <span class="brand-sub">Local AI chat</span>
        </div>
      </div>
      <button class="icon-btn" id="toggle-sidebar" title="بستن سایدبار"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>

    <nav class="side-nav">
      <button class="side-nav-item active" id="nav-chat" type="button">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Chat</span>
      </button>
      <button class="side-nav-item" id="nav-models" type="button">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg>
        <span>Models</span>
      </button>
      <button class="side-nav-item" id="nav-settings" type="button">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <button class="new-chat-btn" id="new-chat-btn">+ چت جدید</button>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="جستجو در تاریخچه..." autocomplete="off" name="chat-history-search" data-1p-ignore data-lpignore="true">
    </div>
    <div class="chat-list" id="chat-list"></div>
    <div class="sidebar-footer">
      <div class="user-profile" id="user-row">
        <div class="avatar-lg" id="user-avatar">؟</div>
        <div class="name" id="user-name">-</div>
        <div class="role" id="user-role">-</div>
      </div>
      <div class="footer-actions">
        <button class="icon-btn" id="logout-btn" title="خروج"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        <button class="icon-btn" id="lock-btn" title="تغییر رمز"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
        <a class="icon-btn" id="admin-link" href="/admin" title="پنل ادمین" style="display:none;text-decoration:none;line-height:1"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></a>
        <button class="icon-btn" id="theme-btn" title="تغییر تم"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor" stroke="none"/></svg></button>
        <button class="icon-btn" id="settings-btn" title="تنظیمات"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="main">
    <div class="topbar">
      <div class="model-picker">
        <button class="model-pill-btn" id="model-btn" type="button">
          <span class="label" id="model-label">مدل ...</span>
          <span class="status-tag">active</span>
          <span class="caret">▾</span>
        </button>
        <div class="model-menu hidden" id="model-menu">
          <div class="menu-title">مدل‌های موجود</div>
          <div id="model-options"></div>
        </div>
      </div>

      <button class="topbar-new" id="topbar-new-chat" type="button">
        <span>+</span> <span class="btn-label">چت جدید</span>
      </button>
      <button class="icon-btn circle-open hidden" id="open-sidebar" title="باز کردن منو"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <button class="icon-btn" id="mobile-menu" title="منو" style="display:none"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>

      <div class="topbar-center">
        <div class="topbar-brand" id="topbar-brand">
          <div class="logo-mark">BG</div>
          <span>black-gpt-local</span>
        </div>
        <input class="chat-title-input hidden" id="chat-title" placeholder="عنوان چت" disabled>
      </div>

      <div class="topbar-right">
        <div class="lm-status" id="lm-status" title="وضعیت LM Studio">
          <span class="dot" id="lm-dot"></span>
          <span class="lm-text" id="lm-text">Local AI</span>
        </div>
        <button class="icon-btn" id="chat-settings-btn" title="تنظیمات این چت"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="messages-inner" id="messages-inner"></div>
    </div>

    <div class="composer-wrap">
      <div class="blocked-banner hidden" id="blocked-banner"></div>
      <div class="composer">
        <button class="icon-btn" id="attach-btn" title="پیوست فایل"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <input type="file" id="file-input" class="hidden">
        <textarea id="input" rows="1" placeholder="پیام خود را بنویسید..." disabled></textarea>
        <button class="send-btn" id="send-btn" title="ارسال" disabled><svg class="send-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
      </div>
      <div class="composer-info">
        <span id="limit-info"></span>
        <span class="usage" id="usage-info"></span>
      </div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<div class="modal-backdrop hidden" id="settings-modal">
  <div class="modal">
    <h3>تنظیمات حساب</h3>
    <label>نام کاربری
      <input type="text" id="set-username">
    </label>
    <label>مدل پیش‌فرض
      <select id="set-model"><option value="">—</option></select>
    </label>
    <label>رمز عبور جدید (خالی = بدون تغییر)
      <input type="password" id="set-password" placeholder="••••••••">
    </label>
    <label>رمز فعلی (برای تغییر رمز لازم است)
      <input type="password" id="set-current-password" placeholder="••••••••">
    </label>
    <div class="modal-actions">
      <button class="btn-primary" id="save-settings">ذخیره</button>
      <button class="btn-secondary" id="cancel-settings">انصراف</button>
    </div>
    <div id="settings-msg" style="margin-top:10px;font-size:13px;"></div>
  </div>
</div>

<!-- Chat settings modal -->
<div class="modal-backdrop hidden" id="chat-settings-modal">
  <div class="modal">
    <h3>تنظیمات این چت</h3>
    <label>عنوان چت
      <input type="text" id="cs-title">
    </label>
    <label>System Prompt
      <textarea id="cs-system" rows="4" placeholder="مثلاً: تو یک برنامه‌نویس حرفه‌ای هستی..."></textarea>
    </label>
    <label>Temperature <span class="range-val" id="cs-temp-val">0.7</span>
      <div class="range-row">
        <input type="range" id="cs-temp" min="0" max="2" step="0.1" value="0.7">
      </div>
    </label>
    <label>Top P <span class="range-val" id="cs-top-p-val">0.95</span>
      <div class="range-row">
        <input type="range" id="cs-top-p" min="0" max="1" step="0.05" value="0.95">
      </div>
    </label>
    <label>Max Tokens
      <input type="number" id="cs-max-tokens" min="64" max="8192" step="64" value="2048">
    </label>
    <div class="modal-actions">
      <button class="btn-primary" id="cs-save">ذخیره</button>
      <button class="btn-secondary" id="cs-cancel">انصراف</button>
    </div>
    <div id="cs-msg" style="margin-top:10px;font-size:13px;"></div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
