<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080A">
<meta name="color-scheme" content="dark light">
<title>Black GPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=20261112b">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/site-icon" id="site-favicon">
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<link rel="stylesheet" href="/vendor/github-dark.min.css" id="hljs-theme">
<script src="/vendor/highlight.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="logo-mark">BG</div>
        <div class="brand-text">
          <span class="brand-name">Black GPT</span>
          <span class="brand-sub">Local AI Workspace</span>
        </div>
      </div>
      <button class="icon-btn" id="toggle-sidebar" title="جمع کردن سایدبار" aria-label="جمع کردن سایدبار">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
    </div>

    <div class="sidebar-section">
      <button class="new-chat-btn" id="new-chat-btn" type="button">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>چت جدید</span>
      </button>
    </div>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="جستجو در گفتگوها..." autocomplete="off" name="chat-history-search" data-1p-ignore data-lpignore="true" aria-label="جستجوی گفتگوها">
    </div>

    <nav class="side-nav" aria-label="ناوبری">
      <button class="side-nav-item active" id="nav-chat" type="button">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>چت</span>
      </button>
      <button class="side-nav-item" id="nav-models" type="button">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M20 9h2M20 15h2M2 9h2M2 15h2"/></svg>
        <span>مدل‌ها</span>
      </button>
      <button class="side-nav-item" id="nav-settings" type="button">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09c-.658.003-1.25.396-1.51 1z"/></svg>
        <span>تنظیمات</span>
      </button>
    </nav>

    <div class="chat-list" id="chat-list"></div>

    <div class="sidebar-footer">
      <div class="user-profile" id="user-row">
        <div class="avatar-lg" id="user-avatar">؟</div>
        <div class="user-meta">
          <div class="name" id="user-name">-</div>
          <div class="role" id="user-role">-</div>
        </div>
      </div>
      <div class="footer-actions">
        <button class="icon-btn" id="settings-btn" title="تنظیمات حساب" aria-label="تنظیمات حساب"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09c-.658.003-1.25.396-1.51 1z"/></svg></button>
        <button class="icon-btn" id="theme-btn" title="تغییر تم" aria-label="تغییر تم"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/></svg></button>
        <button class="icon-btn" id="lock-btn" title="تغییر رمز" aria-label="تغییر رمز"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
        <a class="icon-btn" id="admin-link" href="/admin" title="پنل مدیریت" aria-label="پنل مدیریت" style="display:none;text-decoration:none"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></a>
        <button class="icon-btn" id="logout-btn" title="خروج" aria-label="خروج"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn" id="mobile-menu" title="منو" aria-label="منو" style="display:none"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
      <button class="icon-btn circle-open hidden" id="open-sidebar" title="نمایش سایدبار" aria-label="نمایش سایدبار"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>

      <div class="model-picker">
        <button class="model-pill-btn" id="model-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="label" id="model-label">انتخاب مدل</span>
          <span class="status-tag">مدل</span>
          <span class="caret">▾</span>
        </button>
        <div class="model-menu hidden" id="model-menu" role="listbox">
          <div class="menu-title">مدل‌های موجود</div>
          <div id="model-options"></div>
        </div>
      </div>

      <div class="topbar-center">
        <div class="topbar-brand" id="topbar-brand">
          <div class="logo-mark">BG</div>
          <span>Black GPT</span>
        </div>
        <input class="chat-title-input hidden" id="chat-title" placeholder="عنوان گفتگو" disabled aria-label="عنوان گفتگو">
      </div>

      <div class="topbar-right">
        <button class="topbar-new" id="topbar-new-chat" type="button" title="گفتگوی جدید">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span class="btn-label">چت جدید</span>
        </button>
        <div class="lm-status" id="lm-status" title="وضعیت LM Studio">
          <span class="dot" id="lm-dot"></span>
          <span class="lm-text" id="lm-text">در حال بررسی...</span>
        </div>
        <button class="icon-btn" id="chat-settings-btn" title="تنظیمات گفتگو" aria-label="تنظیمات گفتگو"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="messages-inner" id="messages-inner"></div>
    </div>

    <div class="composer-wrap">
      <div class="blocked-banner hidden" id="blocked-banner"></div>
      <div class="composer">
        <button class="icon-btn" id="attach-btn" title="پیوست فایل" aria-label="پیوست فایل"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <input type="file" id="file-input" class="hidden" aria-hidden="true">
        <textarea id="input" rows="1" placeholder="پیام خود را بنویسید..." disabled aria-label="پیام"></textarea>
        <button class="send-btn" id="send-btn" title="ارسال" aria-label="ارسال" disabled><svg class="send-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
      <div class="composer-info">
        <span id="limit-info"></span>
        <span class="usage" id="usage-info"></span>
      </div>
    </div>
  </main>
</div>

<!-- Settings modal -->
<div class="modal-backdrop hidden" id="settings-modal">
  <div class="modal">
    <h3>تنظیمات حساب</h3>
    <label>نام کاربری
      <input type="text" id="set-username">
    </label>
    <label>مدل پیش‌فرض
      <select id="set-model"><option value="">—</option></select>
    </label>
    <label>رمز عبور جدید (خالی = بدون تغییر)
      <input type="password" id="set-password" placeholder="••••••••">
    </label>
    <label>رمز عبور فعلی (برای تغییر رمز لازم است)
      <input type="password" id="set-current-password" placeholder="••••••••">
    </label>
    <div class="modal-actions">
      <button class="btn-primary" id="save-settings">ذخیره</button>
      <button class="btn-secondary" id="cancel-settings">انصراف</button>
    </div>
    <div id="settings-msg" style="margin-top:10px;font-size:13px;"></div>
  </div>
</div>

<!-- Chat settings modal -->
<div class="modal-backdrop hidden" id="chat-settings-modal">
  <div class="modal">
    <h3>تنظیمات گفتگو</h3>
    <label>عنوان گفتگو
      <input type="text" id="cs-title">
    </label>
    <label>System Prompt
      <textarea id="cs-system" rows="4" placeholder="مثلاً: تو یک برنامه‌نویس حرفه‌ای هستی..."></textarea>
    </label>
    <label>Temperature <span class="range-val" id="cs-temp-val">0.7</span>
      <div class="range-row">
        <input type="range" id="cs-temp" min="0" max="2" step="0.1" value="0.7">
      </div>
    </label>
    <label>Top P <span class="range-val" id="cs-top-p-val">0.95</span>
      <div class="range-row">
        <input type="range" id="cs-top-p" min="0" max="1" step="0.05" value="0.95">
      </div>
    </label>
    <label>Max Tokens
      <input type="number" id="cs-max-tokens" min="64" max="8192" step="64" value="2048">
    </label>
    <div class="modal-actions">
      <button class="btn-primary" id="cs-save">ذخیره</button>
      <button class="btn-secondary" id="cs-cancel">انصراف</button>
    </div>
    <div id="cs-msg" style="margin-top:10px;font-size:13px;"></div>
  </div>
</div>

<script src="/js/app.js?v=20261112b"></script>
</body>
</html>
